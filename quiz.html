<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Online Quiz App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="vh-100 bg-image" onload="getuser(); loadQuestion();">
    <div class="inside-box">
        <nav class="navbar navbar-light bg-dark-green absolute-top w-100">
            <div class="p-3">
                <a class="navbar-brand ms-5" href="#">
                    <img src="assest/logo.png" alt="" width="50" height="50" class="ms-5">
                </a>
            </div>
            <h5 class="pe-5 me-5 text-white" id="username"></h5>
        </nav>
        <div class="d-flex justify-content-end w-100 absolute-top pt-5 pe-5">
            <h4 class="fw-bold pe-5">00:<span id="clock">20</span> s</h4>
        </div>
        <div
            class="container position-absolute top-50 start-50 translate-middle d-flex justify-content-center align-items-center">

            <div
                class="card col-11 col-md-6 text-center justify-content-around align-items-center bg-transparent border-0">
                <div class="d-flex justify-content-between mb-3">
                    <h4 class="fw-bold" id="questionCount"></h4>
                </div>
                <div class="justify-content-center align-items-center w-100 p-4 bg-light rounded-3" id="quizPage">
                    <h5 id="questionText"></h5>
                    <div id="options" class="mt-3"></div>
                </div>
                <div class="d-flex justify-content-end mb-3 w-100">
                    <button class="btn bg-green text-white login-btn mt-3 float-end w-25 me-3"
                        onclick="nextQuestion()">Next</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
