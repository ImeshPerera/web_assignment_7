<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Online Quiz App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="vh-100" onload="getuser(); loadscore();">
    <nav class="navbar navbar-light bg-dark-green absolute-top w-100">
        <div class="p-3">
            <a class="navbar-brand ms-5" href="#">
                <img src="assest/logo.png" alt="" width="50" height="50" class="ms-5">
            </a>

        </div>
        <h5 class="pe-5 me-5 text-white" id="username"></h5>
    </nav>
    <div
        class="container position-absolute top-50 start-50 translate-middle d-flex justify-content-center align-items-center vh-100">
        <div class="card col-11 col-md-6 col-lg-4 text-center login-card justify-content-around align-items-center">
            <h2 class="mb-3 text-success">Your Result</h2>
            <h2 class="mb-3 text-danger" id="score"></h2>
            <button class="btn login-btn bg-green text-white w-50" onclick="startQuiz()">Start Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
